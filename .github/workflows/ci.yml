name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: windows-target-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-target-${{ hashFiles('**/Cargo.lock') }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo build (debug)
        run: cargo build

      - name: cargo build (release)
        run: cargo build --release

      - name: Verify release binary exists
        shell: pwsh
        run: |
          $exe = "target\release\vibe-chat.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Release binary not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "Release binary: $exe ($([math]::Round($size / 1MB, 2)) MB)"

  check-core:
    name: Check Core (Linux/macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check
